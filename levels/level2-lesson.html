<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER RPG - Level 2: Python Basics</title>
    <link rel="stylesheet" href="../css/cyber-theme.css">
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <button class="mode-toggle" id="mode-toggle">KIDS MODE</button>
    <div class="cyber-container">
        <header class="cyber-header">
            <h1 class="cyber-logo" data-text="LEVEL 2">LEVEL 2</h1>
            <p class="cyber-subtitle">📡 فك الشفرات بـ Python</p>
        </header>
        <div class="cyber-hud" id="main-hud">
            <div class="hud-item"><div class="hud-label">المستوى</div><div class="hud-value" id="hud-level">2</div></div>
            <div class="hud-item"><div class="hud-label">الرتبة</div><div class="hud-value" id="hud-rank">👶 Script Kiddie</div></div>
            <div class="hud-item"><div class="hud-label">النقاط</div><div class="hud-value" id="hud-xp">0</div></div>
            <div class="hud-item"><div class="hud-label">الحياة</div><div class="hud-value" id="hud-lives">❤️❤️❤️</div></div>
            <div class="hud-item"><div class="hud-label">الشرارة</div><div class="hud-value" id="hud-streak" style="display:none">🔥 0</div></div>
            <div class="hud-xp-bar-container"><div class="hud-xp-bar-bg"><div class="hud-xp-bar" id="hud-xp-bar" style="width: 0%"></div></div></div>
        </div>
        <div id="lesson-container" style="margin: 20px 0;"></div>
        <div style="text-align: center; margin: 30px 0;">
            <a href="../index.html" class="cyber-btn">⬅️ العودة للخريطة</a>
        </div>
    </div>
    <div id="agent-zero"><div class="agent-avatar" id="agent-avatar">🤖</div></div>
    <script src="../js/cyber-engine.js"></script>
    <script src="../js/lesson-engine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const CE = window.CyberEngine;
            CE.startSession();
            CE.updateHUD();
            const lesson = new LessonEngine.LessonBuilder('lesson-container', {
                profile: 'teen', topic: 'python', level: 2
            });
            lesson.addStory([{"avatar": "🤖", "speaker": "Agent Zero", "text": "بعد اختراق الباب الأول... وجدت ملفاً غامضاً مُوقّع باسم PHANTOM!", "simple": "لقيت ملف غامض!", "delay": 1000}, {"avatar": "📄", "speaker": "الملف", "text": "الملف مشفر بتشفير قيصري قديم... لكنه يحتوي على إحداثيات!", "simple": "الملف مشفر! بدنا نفكه!", "delay": 1500}, {"avatar": "🤖", "speaker": "Agent Zero", "text": "📊 المهمة: استخدم Python لفك الشفرة وكشف الموقع المخفي!", "simple": "تعلم Python عشان تفك الشفرة!", "delay": 1500}]);
            lesson.addConcept({"title": "ما هو Python؟", "visualHTML": "<div style=\"text-align:center; padding:20px;\"><div style=\"font-size:4rem; animation:float 3s infinite;\">🐍</div><div style=\"margin-top:10px; color:var(--neon-green);\">Python = لغة البرمجة السحرية!</div></div><style>@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}</style>", "analogy": {"game": "Python مثل لعبة LEGO: تركّب القطع وتبني أي شيء!", "tech": "Python هي لغة برمجة عالية المستوى، سهلة القراءة والكتابة", "real": "Python مثل آلة حاسبة ذكية تفهم أوامر باللغة الإنجليزية"}, "explanation": {"simple": "Python هي لغة تقدر تكتب فيها أوامر للكمبيوتر بشكل سهل!", "normal": "Python هي لغة برمجة تُستخدم في الذكاء الاصطناعي، الأمن السيبراني، وتحليل البيانات.", "technical": "Python هي لغة برمجة مفسرة (interpreted)، ديناميكية الكتابة، تدعم البرمجة كائنية ووظيفية."}, "codeExample": "# تشفير قيصري بسيط\\nmessage = 'HELLO'\\nshift = 3\\n\\nfor char in message:\\n    new_char = chr(ord(char) + shift)\\n    print(new_char)  # KHOOR", "tips": "💡 Python = لغة #1 في الأمن السيبراني والذكاء الاصطناعي!"});
            lesson.addDemo({"steps": [{"prompt": ">>>", "text": "message = \"PHANTOM\"", "type": "command", "explanation": "💡 نخزن النص في متغير"}, {"text": "تم التخزين!", "type": "output", "explanation": "✅ المتغير message يحتوي على PHANTOM"}, {"prompt": ">>>", "text": "shift = 3", "type": "command", "explanation": "💡 مفتاح التشفير = 3"}, {"prompt": ">>>", "text": "for c in message: print(chr(ord(c) + shift))", "type": "command", "explanation": "💡 نزيح كل حرف 3 خطوات"}, {"text": "S\\nK\\nD\\nQ\\nW\\nT\\nR\\nQ", "type": "output", "explanation": "🎉 P→S, H→K, A→D... الشفرة انفكت!"}]});
            lesson.addPractice({"task": "اكتب كود Python يفك تشفير Caesar! (استخدم chr(ord(c) - 3))", "prompt": "python>>> ", "hints": ["💡 message = 'SKDQWWRP'", "💡 for c in message: print(chr(ord(c) - 3))", "💡 الناتج يجب أن يكون PHANTOM"]});
            lesson.addChallenge([{"question": "ما هي لغة Python؟", "options": ["لغة ترجمة", "لغة برمجة", "لغة تشفير فقط", "لغة تصميم"], "correct": 1}, {"question": "ما وظيفة ord() في Python؟", "options": ["ترتيب القائمة", "تحويل حرف لرقم ASCII", "طباعة نص", "حذف ملف"], "correct": 1}, {"question": "في تشفير Caesar بمفتاح 3، الحرف D يصبح:", "options": ["A", "G", "E", "F"], "correct": 1}, {"question": "لماذا Python مشهورة في الأمن السيبراني؟", "options": ["صعبة التعلم", "سهلة وسريعة", "بطيئة جداً", "للأطفال فقط"], "correct": 1}]);
            lesson.render();
            setTimeout(() => CE.agentSpeak('correct', '👋 مرحباً Agent! ابدأ الدرس!'), 1000);
        });
    </script>
</body>
</html>
